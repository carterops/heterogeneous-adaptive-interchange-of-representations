[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-representation-bridge"
version = "0.2.0"
description = "H-A-I-R: adaptive, representation-preserving interchange for heterogeneous specialist teams."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hairbridge = ["cases.json"]
